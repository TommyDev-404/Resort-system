<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Admin Login - Grand-Villa Laguna System</title>
	<meta name="description" content="A resort management system with forecasting, reservations, and secure admin access for Laguna Grand-Villa Resort. Fast, reliable, and easy to use.">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{{ url_for('static', filename='style/output.css') }}">
      <link rel="icon" type="image/x-icon" href="/static/assets/admin.webp">
	<script src="https://unpkg.com/lucide@latest" defer></script>
	
</head>
<style>
	@keyframes fadeInUp {
		0% {
			opacity: 0;
			transform: translateY(10px);
		}
		100% {
			opacity: 1;
			transform: translateY(0);
		}
	}

	.fade-in-up {
		animation: fadeInUp 0.6s ease-out forwards;
	}

	body {
		min-height: 100vh; /* full screen height */
		margin: 0;
		display: flex;
		justify-content: center;
		align-items: center;
		background-image: url('{{ url_for("static", filename="assets/bg.webp") }}');
		background-size: cover;       /* cover the entire body */
		background-position: center;  /* center the image */
		background-repeat: no-repeat; /* avoid repeating */
		position: relative;
		font-family: 'Inter', sans-serif;
	}

	/* Optional overlay for readability */
	body::before {
		content: "";
		position: absolute;
		inset: 0; /* top:0; left:0; bottom:0; right:0 */
		background: rgba(0, 0, 0, 0.5); /* dark overlay */
		z-index: 0;
	}

	/* Make sure the login form is above the overlay */
	.login-container {
		position: relative;
		z-index: 1;
	}

</style>

<body>
	<div id="initial-loading" class="absolute top-0 left-0 z-50 flex flex-col items-center justify-center h-screen inset-0 bg-black/50 text-white space-y-2">
		<div class="w-8 h-8 border-4 border-gray-500 border-t-blue-500 rounded-full animate-spin"></div>
		<p class="text-[15px] font-medium animate-pulse">Loading, please wait...</p>
	</div>

	<!-- Overlay Container -->
	<div class="absolute hidden top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[550px] p-6 overflow-hidden bg-transparent backdrop-blur-[20px] border border-white/40 rounded-xl shadow-2xl before:content-[''] before:absolute before:inset-0 before:border before:border-white/20 before:rounded-xl before:pointer-events-none" id="overlay-container">
		<!-- CONTENT LAYER -->
		<div class="relative z-10">
			<!-- LOGO -->
			<div class="flex flex-col items-center w-full mb-6">
				<img src="{{ url_for('static', filename='assets/logo.webp') }}" class="w-10 h-10 rounded-full mb-1 shadow-xl opacity-90" alt="Logo">
				<div class="flex w-full items-center my-1">
					<div class="flex-grow border-t border-white/30"></div>
					<p class="mx-4 text-white/80 font-semibold tracking-wider uppercase text-xs">GRAND VILLA LAGUNA</p>
					<div class="flex-grow border-t border-white/30"></div>
				</div>
			</div>
			
			<!-- LOGIN FORM -->
			<div id="loginForm" class="w-full flex flex-col items-center transition-all duration-500 ease-in-out opacity-100">
				<form class="loginForm w-full flex flex-col gap-4">
					<div class="flex flex-col items-center justify-center">
						<img src="{{ url_for('static', filename='assets/admin.webp') }}" class="w-12 h-12 opacity-100" alt="Admin User Icon">
						<h1 class="text-2xl font-bold mb-6 text-white">Admin Login</h1>
					</div>

					<!-- Username -->
					<div class="relative">
						<img src="{{ url_for('static', filename='assets/admin.webp') }}" width="30" class="absolute top-3 right-3 z-10 opacity-100"alt="Username Icon">
						<input type="text" name="username" required placeholder="Username" class="w-full bg-white/20 border border-white/30 rounded-lg px-4 py-3 text-md text-white placeholder-white/60 outline-none focus:ring-2 focus:ring-blue-500 transition">
					</div>
				
					<!-- Password -->
					<div class="passField relative">
						<img src="{{ url_for('static', filename='assets/eye.webp') }}" id="show" width="22" class="absolute top-3 right-4 z-10 opacity-100" alt="Password Icon">
						<input type="password" name="password" required placeholder="Password" class="w-full bg-white/20 border border-white/30 rounded-lg px-4 py-3 text-md text-white placeholder-white/60 outline-none focus:ring-2 focus:ring-blue-500 transition">
					</div>

					<a id="forgotLink" class="self-end text-white/70 text-sm hover:text-blue-400 underline cursor-pointer">Forgot password?</a>
					<button type="submit" class="bg-blue-700 hover:bg-blue-600 text-white font-semibold py-3 rounded-full w-full mt-4 transition">Login</button>
				</form>
			
				<!-- Socials -->
				<div class="flex flex-col items-center mt-4">
					<p class="text-white/70 mb-2 text-xs tracking-wide">Resort social media:</p>
					<div class="flex gap-4 justify-center items-center">
						<a href="https://www.facebook.com/grandvillalaguna"target="_blank"
						rel="noopener noreferrer"
						aria-label="Visit Grand Villa Laguna on Facebook"
						class="transform transition hover:scale-110 hover:shadow-lg rounded-full">
							<img src="{{ url_for('static', filename='assets/facebook.webp') }}" class="w-6 h-6 rounded-full opacity-90" alt="">
						</a>
					
						<a href="https://x.com/GVilla72742?t=JvxM-upPPKSWsgkS-bOY6w&s=09" target="_blank" rel="noopener noreferrer" aria-label="Visit Grand Villa Laguna on Twitter"
						class="transform transition hover:scale-110 hover:shadow-lg rounded-full">
						<img src="{{ url_for('static', filename='assets/twitter.webp') }}" class="w-6 h-6 rounded-full opacity-90" alt="">
						</a>
					
						<a href="https://www.instagram.com/grand_villaresort?igsh=dDVveXQ5Z3Q3NGpw" target="_blank" rel="noopener noreferrer" aria-label="Visit Grand Villa Laguna on Instagram"
						class="transform transition hover:scale-110 hover:shadow-lg rounded-full">
						<img src="{{ url_for('static', filename='assets/social.webp') }}" class="w-6 h-6 rounded-full opacity-90" alt="">
						</a>
					</div>				  
				</div>
			</div>
			
			<!-- FORGOT PASSWORD -->
			<div id="forgotForm" class="hidden w-full flex flex-col items-center gap-4 transition-all duration-500 ease-in-out opacity-0">
				<div class="flex flex-col items-center justify-center">
					<img src="{{ url_for('static', filename='assets/forgot.webp') }}" class="w-12 h-12 opacity-100" alt="Admin User Icon">
					<h1 class="text-2xl font-bold mb-6 text-white">Forgot Password</h1>
				</div>
				
				<p class="text-sm text-center text-white/70">Enter your email and we’ll send a verification code.</p>
				<div class="flex gap-2 w-full">
					<input type="email" name="email" required placeholder="Enter your email" class="flex-1 bg-white/20 border border-white/30 rounded-lg px-4 py-3 text-white placeholder-white/60 outline-none focus:ring-2 focus:ring-blue-500 transition">
					<button id="get_code" class="bg-green-500 hover:bg-green-600 text-white px-4 py-3 rounded-lg font-medium transition">Get Code</button>
				</div>
				<input type="text" name="code" maxlength="6" required placeholder="Enter 6-digit code" class="w-full bg-white/20 border border-white/30 rounded-lg px-4 py-3 text-white placeholder-white/60 outline-none focus:ring-2 focus:ring-blue-500 transition">
				<button id="link-change-pass" class="bg-blue-700 hover:bg-blue-600 text-white py-3 rounded-full font-semibold w-full mt-4 transition">Continue</button>
				<p class="text-sm text-white/70 mt-2 flex gap-1 items-center">Remember your password?<span id="backToLogin" class="text-blue-500 hover:underline cursor-pointer">Login</span></p>
			</div>
			
			<!-- CHANGE PASSWORD -->
			<div id="changePasswordForm" class="hidden w-full flex flex-col items-center gap-1 transition-all duration-500 ease-in-out opacity-0">
				<div class="flex flex-col items-center justify-center">
					<img src="{{ url_for('static', filename='assets/change.webp') }}" class="w-12 h-12 opacity-100" alt="Admin User Icon">
					<h1 class="text-2xl font-bold mb-6 text-white">Change Password</h1>
				</div>

				<input type="password" name="new_password" required placeholder="Enter new password" class="w-full bg-white/20 border border-white/30 rounded-lg px-4 py-3 text-white placeholder-white/60 outline-none focus:ring-2 focus:ring-blue-500 transition">
				<label class="text-sm text-white/70 flex items-center gap-2 w-full"><input type="checkbox" id="showPassword">Show Password</label>
				<button id="change-pass" class="bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-full font-semibold w-full transition mt-6">Update</button>
				<p class="text-sm text-white/70">Remember your password?<span id="backToLogin2" class="text-blue-500 hover:underline cursor-pointer">Login</span></p>
			</div>
			
		</div>
	</div>
	

<div id="loadingPortal"></div>
<div id="messagePortal"></div>

<script type="module" src="{{ url_for('static', filename='scripts/login.js') }}" defer></script>

</body>
</html>
